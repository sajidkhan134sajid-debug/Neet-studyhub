<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEET StudyHub — index.html fixer</title><style>body{font-family:system-ui;max-width:720px;margin:40px auto;padding:0 18px;background:#07111f;color:#fff}button{padding:12px 16px;border:0;border-radius:10px;font-weight:700;margin:8px 0}input{margin:12px 0}pre{white-space:pre-wrap;background:#0d1b2d;padding:14px;border-radius:12px}</style><h1>NEET StudyHub index.html fixer</h1><p>Apne current <b>index.html</b> ko select karo. Ye usi file me sirf live-room fixes lagakar naya <b>index.html</b> download karega.</p><input id="file" type="file" accept=".html,text/html"><br><button id="go">Fix & Download index.html</button><pre id="out">Waiting for file…</pre><script>
const out=document.getElementById('out');
function patch(c){
 const before=c;
 c=c.replace('trysocket=io({auth:{token}});','socket=io({auth:{token}});');
 c=c.replace("lkRoom.on(api.RoomEvent.ParticipantDisconnected,p=>{removeParticipant(p);add('System',(p.name||'Student')+' left the video room')});lkRoom.on(api.RoomEvent.Disconnected,()=>add('System','Live connection ended.'));","lkRoom.on(api.RoomEvent.ParticipantDisconnected,p=>{removeParticipant(p);add('System',(p.name||'Student')+' left the video room')});lkRoom.on(api.RoomEvent.Reconnecting,()=>{$('roomNotice').textContent='Live connection reconnecting…';$('presence').textContent='🟠 Live reconnecting…'});lkRoom.on(api.RoomEvent.Reconnected,()=>{for(const p of lkRoom.remoteParticipants.values())attachExistingTracks(p);$('presence').textContent='🟢 Live connected · '+lkRoom.remoteParticipants.size+' other students';$('roomNotice').textContent='Live room connected. Tap Mic or Camera to turn them on.'});lkRoom.on(api.RoomEvent.Disconnected,()=>add('System','Live connection ended.'));");
 c=c.replace("function removeParticipant(p){document.querySelectorAll('.video').forEach(x=>{if(x.textContent.includes(p.name||''))x.remove()});for(const pub of p.trackPublications.values())$('remote-'+pub.trackSid)?.remove()}","function removeParticipant(p){for(const pub of p.trackPublications.values()){const sid=pub.trackSid||pub.track?.sid;if(sid)$('remote-'+sid)?.remove()}}");
 c=c.replace("async function toggleMic(){if(!lkRoom?.localParticipant){toast('Room is still connecting');return}","async function toggleMic(){if(!lkRoom?.localParticipant||lkRoom.state!==api.ConnectionState.Connected){toast('Live room is still connecting');return}");
 c=c.replace("async function toggleCam(){if(!lkRoom?.localParticipant){toast('Room is still connecting');return}","async function toggleCam(){if(!lkRoom?.localParticipant||lkRoom.state!==api.ConnectionState.Connected){toast('Live room is still connecting');return}");
 return {c,changed:c!==before};
}
document.getElementById('go').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f){out.textContent='Pehle current index.html select karo.';return}const c=await f.text();const r=patch(c);const checks=[['socket typo fixed',r.c.includes('socket=io({auth:{token}});')&&!r.c.includes('trysocket=io')],['reconnect added',r.c.includes('RoomEvent.Reconnecting')&&r.c.includes('RoomEvent.Reconnected')],['participant cleanup fixed',r.c.includes('const sid=pub.trackSid||pub.track?.sid')],['camera/mic connection guard',r.c.includes('lkRoom.state!==api.ConnectionState.Connected')]];out.textContent=(r.changed?'Fixes applied.':'No matching changes were needed.')+'\n\n'+checks.map(x=>(x[1]?'✓ ':'✗ ')+x[0]).join('\n');if(!r.changed)return;const blob=new Blob([r.c],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
